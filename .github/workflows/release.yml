name: Release

# Publishes a GitHub Release on EVERY push to main (continuous delivery) and on
# manual version tags (v*). For main pushes the version comes from package.json
# (the single source of truth, bumped on every push, starting at 0.0.1) and the
# matching v<version> tag is created by the release step itself. If package.json
# was not bumped, its tag already exists and the publish is skipped (never a
# clobber). The complete quality/browser/native gate passes before publishing, and the tested
# dist/ is zipped and attached with generated notes.
#
# Note: tags created here use GITHUB_TOKEN, which by design does NOT trigger
# other workflows — so docker.yml's semver/latest images still come from
# manually pushed v* tags; `edge` already tracks every main push.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# One release at a time — never cancel a publish mid-flight. GitHub keeps at
# most one *queued* run per group: if several main pushes land within one
# validation window, the intermediate queued version is superseded and skipped
# (its tag is never created). Release it afterwards by pushing its `v<version>`
# tag on the matching commit.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # mint the OIDC token for artifact provenance attestation
  attestations: write # write the attestation to the repo

jobs:
  validation:
    name: Validation
    uses: ./.github/workflows/validation.yml
    with:
      release_artifacts: true

  release:
    name: Build & publish release
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history + tags so the changelog extract and the existing-tag
          # check (skip-if-already-released) work.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download validated application bundle
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist

      - name: Download executables tested on native runners for this SHA
        uses: actions/download-artifact@v4
        with:
          pattern: native-*-${{ github.sha }}
          path: native-artifacts
          merge-multiple: true

      - name: Resolve release tag
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            # A manual dispatch from another branch must never publish its
            # binaries under a version tag.
            TAG="v0.0.0-unreleased"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Not on main (${GITHUB_REF}) — skipping publish."
          else
            # package.json owns the version (bumped on every push to main), and
            # the release/tag simply follows it — one source of truth. Read it
            # without assuming a runtime is on PATH.
            VER=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)
            TAG="v${VER}"
            # Skip if this version already has a tag (package.json wasn't bumped
            # this push) — fails safe as a no-publish, never a clobber.
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "Tag ${TAG} already exists (package.json version not bumped) — skipping publish."
            else
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog notes
        id: notes
        if: steps.ver.outputs.publish == 'true'
        run: |
          # Publish the CHANGELOG.md section for this version as the release body.
          # Prefer an exact "## [x.y.z]" section; fall back to "## [Unreleased]";
          # if neither has content, leave it empty and let generate_release_notes
          # produce the auto commit list.
          VER="${{ steps.ver.outputs.tag }}"; VER="${VER#v}"
          extract() {
            awk -v h="$1" '
              /^## /{ if (p) exit; if (index($0, h)) { p=1; next } }
              p { print }
            ' CHANGELOG.md
          }
          : > notes.md
          if [ -f CHANGELOG.md ]; then
            extract "[$VER]" > notes.md
            [ -s notes.md ] || extract "[Unreleased]" > notes.md
          fi
          # Drop trailing link-reference definitions (e.g. "[0.1.0]: https://…")
          # that the last section runs into, then trim leading blank lines.
          sed -i -E '/^\[[^]]+\]: https?:\/\//d' notes.md
          sed -i -e '/./,$!d' notes.md
          if [ -s notes.md ]; then echo "Using CHANGELOG.md section for ${VER}"; else echo "No changelog section — falling back to generated notes"; fi

      - name: Package bundle
        if: steps.ver.outputs.publish == 'true'
        run: |
          cp README.md dist/README.md
          (cd dist && zip -qr "../bunqueue-dashboard-${{ steps.ver.outputs.tag }}.zip" .)

      - name: Name the tested executables for release
        if: steps.ver.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          test "$(find native-artifacts -type f | wc -l)" -eq 5
          for file in native-artifacts/*; do
            suffix="${file##*/}"
            suffix="${suffix#bunqueue-dashboard-}"
            mv "$file" "bunqueue-dashboard-${RELEASE_TAG}-${suffix}"
          done

      # SHA256SUMS lets anyone verify a downloaded artifact's integrity
      # (`sha256sum -c SHA256SUMS`). The two patterns MUST stay disjoint — the zip
      # is bunqueue-dashboard-<tag>.zip and the binaries are
      # bunqueue-dashboard-<tag>-<platform>. They are anchored on the exact tag:
      # a generic `bunqueue-dashboard-v*-*` also matches the zip of a hyphenated
      # tag (v1.0.0-rc.1), and a doubled match means a duplicated line here and a
      # racing double upload in the release step below (broke v0.0.22).
      - name: Generate checksums
        if: steps.ver.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          sha256sum "bunqueue-dashboard-${RELEASE_TAG}.zip" "bunqueue-dashboard-${RELEASE_TAG}"-* > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 6

      # Signed, verifiable build provenance (SLSA) for every published artifact,
      # so downloads can be checked with `gh attestation verify <file> --repo …`.
      - name: Attest artifact provenance
        if: steps.ver.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            bunqueue-dashboard-${{ steps.ver.outputs.tag }}.zip
            bunqueue-dashboard-${{ steps.ver.outputs.tag }}-*

      - name: Publish GitHub Release
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          # Tag the commit that was validated — not whatever main points to when
          # this (possibly queued) job finally publishes.
          target_commitish: ${{ github.sha }}
          # Curated CHANGELOG.md section as the body; generated notes (the auto
          # commit/PR list) are appended after it. An empty notes.md → notes only.
          body_path: notes.md
          generate_release_notes: true
          files: |
            bunqueue-dashboard-${{ steps.ver.outputs.tag }}.zip
            bunqueue-dashboard-${{ steps.ver.outputs.tag }}-*
            SHA256SUMS
          fail_on_unmatched_files: true

  # Publishes the package to npm (`bunx bunqueue-dashboard`) after the release
  # job's gate has passed, through npm trusted publishing (OIDC, trusted
  # publisher: release.yml, environment `npm`) with a signed provenance
  # attestation and no long-lived npm token. It is split in two jobs so the
  # publish credential never reaches code that installs dependencies or builds:
  # `npm-pack` packs with Bun and holds no credential; `npm` only downloads that
  # tarball and publishes it. Idempotent: an un-bumped push (version already on
  # the registry) is a clean skip; any other registry answer fails closed.
  npm-pack:
    name: Pack for npm
    runs-on: ubuntu-latest
    needs: release
    # Same rule as the GitHub Release: only main or a version tag may publish.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.pre.outputs.publish }}
      version: ${{ steps.pre.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Check publish preconditions
        id: pre
        run: |
          set -euo pipefail
          VER=$(bun -p "require('./package.json').version")
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          # 404 = unpublished, 200 = already on npm (clean skip); anything else
          # (network or registry error) stops instead of guessing.
          STATUS=$(bun -e '
            const r = await fetch("https://registry.npmjs.org/bunqueue-dashboard/" + encodeURIComponent(process.argv[1]));
            console.log(r.status);
          ' "$VER")
          case "$STATUS" in
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            200)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "bunqueue-dashboard@${VER} already on npm — skipping." ;;
            *) echo "::error::Registry returned $STATUS for bunqueue-dashboard@${VER}"; exit 1 ;;
          esac

      - name: Install dependencies
        if: steps.pre.outputs.publish == 'true'
        run: bun install --frozen-lockfile

      # `bun pm pack` runs the `prepack` script (version check, vite build, embed
      # manifest), so the tarball always carries a fresh dist/.
      - name: Pack
        if: steps.pre.outputs.publish == 'true'
        run: |
          mkdir -p /tmp/npm-package
          bun pm pack --destination /tmp/npm-package

      - name: Upload the packed tarball
        if: steps.pre.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-bunqueue-dashboard-${{ steps.pre.outputs.version }}
          path: /tmp/npm-package/bunqueue-dashboard-${{ steps.pre.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7

  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: npm-pack
    if: needs.npm-pack.outputs.publish == 'true'
    timeout-minutes: 10
    environment: npm
    # Only the OIDC permission: this job checks out nothing and runs no
    # repository or dependency code.
    permissions:
      id-token: write
    env:
      VERSION: ${{ needs.npm-pack.outputs.version }}
    steps:
      - name: Download the packed tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-bunqueue-dashboard-${{ needs.npm-pack.outputs.version }}
          path: /tmp/npm-package

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Bun's publisher has no OIDC support.
      - name: Install the npm CLI used for trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@11.6.2
          node -e '
            const [major, minor, patch] = process.argv[1].trim().split(".").map(Number);
            if (major * 1e6 + minor * 1e3 + patch < 11005001) throw new Error("npm " + process.argv[1] + " cannot use trusted publishing");
          ' "$(npm --version)"

      - name: Publication dry run
        run: npm publish --dry-run --ignore-scripts --access public "/tmp/npm-package/bunqueue-dashboard-$VERSION.tgz"

      - name: Publish with provenance
        run: npm publish --ignore-scripts --access public --provenance "/tmp/npm-package/bunqueue-dashboard-$VERSION.tgz"
