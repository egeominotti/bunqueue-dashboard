name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation:
    name: Validation
    uses: ./.github/workflows/validation.yml

  gate:
    name: Stability gate
    if: always()
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality, browser and native binary check
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: test "$VALIDATION_RESULT" = success
