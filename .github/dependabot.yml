version: 2
updates:
  # Application dependencies. The lockfile is bun.lock, which only the `bun`
  # ecosystem can update (`npm` fails every run: it cannot rewrite bun.lock).
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      react:
        patterns: ["react", "react-dom", "react-router-dom", "@types/react*"]
      dev-tooling:
        patterns: ["vite", "@vitejs/*", "@tailwindcss/*", "tailwindcss", "oxlint", "oxlint-tsgolint", "typescript", "@types/*"]
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"

  # Docker base images.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(docker)"
